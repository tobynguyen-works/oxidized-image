packages:
  - packages/*
  - playgrounds/*
  - website

catalogMode: prefer

catalogs:
  types:
    '@types/node': ^26.1.0
    '@typescript/native-preview': 7.0.0-dev.20260705.1
    typescript: ^6.0.3
    '@effect/language-service': ^0.86.6
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.7
    '@types/mdx': ^2.0.14
  build:
    vite: npm:@voidzero-dev/vite-plus-core@0.3.0
    vite-plus: 0.3.0
    '@tailwindcss/vite': ^4.3.3
    tailwindcss: ^4.3.3
  lint:
    oxlint-plugin-case-police: ^1.0.1
  dev:
    '@napi-rs/image': ^1.14.0
    astro: ^7.3.1
    mlly: ^1.8.2
  test:
    vitest: ^5.0.0
  prod:
    image-meta: ^0.2.2
    effect: ^3.22.1
    ohash: ^2.0.12
    pathe: ^2.0.3
    picocolors: ^1.1.1
    pretty-bytes: ^7.1.3
    unstorage: ^1.17.5
  scripts:
    tegami: ^1.5.0
    tinyexec: ^1.3.1
  frontend:
    fumadocs-core: ^16.15.6
    fumadocs-mdx: ^15.4.0
    fumadocs-ui: ^16.15.6
    fumapress: 0.6.3
    lucide-react: ^1.41.0
    react: ^19.2.8
    react-dom: ^19.2.8
    react-server-dom-webpack: ^19.2.8
    waku: 1.0.0-beta.6

overrides:
  vite: 'catalog:build'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@0.2.2'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.2.2'
  - '@voidzero-dev/vite-plus-darwin-x64@0.2.2'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.2'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.2.2'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.2.2'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.2.2'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.2'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.2.2'
  - vite-plus@0.2.2
  - oxlint-plugin-case-police@1.0.1
  - '@typescript/native-preview-darwin-arm64@7.0.0-dev.20260702.3'
  - '@typescript/native-preview-darwin-x64@7.0.0-dev.20260702.3'
  - '@typescript/native-preview-linux-arm64@7.0.0-dev.20260702.3'
  - '@typescript/native-preview-linux-arm@7.0.0-dev.20260702.3'
  - '@typescript/native-preview-linux-x64@7.0.0-dev.20260702.3'
  - '@typescript/native-preview-win32-arm64@7.0.0-dev.20260702.3'
  - '@typescript/native-preview-win32-x64@7.0.0-dev.20260702.3'
  - '@typescript/native-preview@7.0.0-dev.20260702.3'
  - tegami@1.2.2
  - '@typescript/typescript-aix-ppc64@7.0.2'
  - '@typescript/typescript-darwin-arm64@7.0.2'
  - '@typescript/typescript-darwin-x64@7.0.2'
  - '@typescript/typescript-freebsd-arm64@7.0.2'
  - '@typescript/typescript-freebsd-x64@7.0.2'
  - '@typescript/typescript-linux-arm64@7.0.2'
  - '@typescript/typescript-linux-arm@7.0.2'
  - '@typescript/typescript-linux-loong64@7.0.2'
  - '@typescript/typescript-linux-mips64el@7.0.2'
  - '@typescript/typescript-linux-ppc64@7.0.2'
  - '@typescript/typescript-linux-riscv64@7.0.2'
  - '@typescript/typescript-linux-s390x@7.0.2'
  - '@typescript/typescript-linux-x64@7.0.2'
  - '@typescript/typescript-netbsd-arm64@7.0.2'
  - '@typescript/typescript-netbsd-x64@7.0.2'
  - '@typescript/typescript-openbsd-arm64@7.0.2'
  - '@typescript/typescript-openbsd-x64@7.0.2'
  - '@typescript/typescript-sunos-x64@7.0.2'
  - '@typescript/typescript-win32-arm64@7.0.2'
  - '@typescript/typescript-win32-x64@7.0.2'
  - typescript@7.0.2

allowBuilds:
  esbuild: true
  sharp: true
